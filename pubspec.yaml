name: dart_architecture_lints
description: "Custom static-analysis rules for Flutter projects built on Clean Architecture and MVVM. Encodes recurring architectural and correctness failures as executable lint rules."
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  analysis_server_plugin: 0.3.25
  analyzer: 14.6.0
  yaml: ^3.1.4

dev_dependencies:
  analyzer_testing: 0.4.4
  test: ^1.26.2
  lints: ^6.0.0
