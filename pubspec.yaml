name: dart_architecture_lints
description: "Custom static-analysis rules for Flutter projects built on Clean Architecture and MVVM. Encodes recurring architectural and correctness failures as executable lint rules."
version: 0.0.6

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  analyzer: ^8.0.0
  analyzer_plugin: ^0.13.7
  custom_lint_builder: ^0.8.1

dev_dependencies:
  custom_lint: ^0.8.1
  test: ^1.26.2
  lints: ^6.0.0
  yaml: ^3.1.3
  package_config: ^2.2.0
  crypto: ^3.0.7
