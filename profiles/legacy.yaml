# Generated by tool/generate_rule_tables.dart; edit selections in your project.
# legacy selection. See docs/configuration.md before adopting a profile.
analyzer:
  plugins:
    - custom_lint
custom_lint:
  enable_all_lint_rules: false
  rules:
    - app_exception_must_define_code: true
    - avoid_async_in_provider_create: true
    - avoid_async_wrapper_hides_unawaited: true
    - avoid_hardcoded_strings: true
    - avoid_scattered_401_handling: true
    - avoid_unawaited: true
    - avoid_unawaited_ignore_without_reason: true
    - datasources_return_result: true
    - domain_entities_must_use_freezed: true
    - enforce_final_variables: true
    - enforce_utc_dates: true
    - logger_context_matches_scope: true
    - logger_context_must_be_structured: true
    - method_order: true
    - mixin_no_state_ownership: true
    - models_must_have_json_serialization: true
    - multiprovider_order: true
    - no_bang_operator: true
    - no_business_logic_in_widgets: true
    - no_civil_utc_mix_without_helper: true
    - no_device_local_in_presentation: true
    - no_direct_error_logging_in_data_domain: true
    - no_direct_internet_calls: true
    - no_domain_entities_in_presentation_ui: true
    - no_exception_message_passthrough: true
    - no_external_dependencies_in_domain: true
    - no_hardcoded_border_radius: true
    - no_hardcoded_color_literal: true
    - no_late_keyword: true
    - no_local_datetime_constructors: true
    - no_raw_exception_message_to_user: true
    - no_result_throw: true
    - no_sensitive_data_in_log_metadata: true
    - no_serialization_in_entities: true
    - no_static_map_controllers: true
    - no_utc_time_format_without_empresa_helper: true
    - one_class_per_file: true
    - overlay_lifecycle_context_safety: true
    - repository_methods_return_result: true
    - require_explicit_types: true
    - require_keys_in_lists: true
    - streamcontroller_must_close: true
    - top_level_screens_must_use_base_contract: true
    - uistate_must_call_super_dispose: true
    - usecases_extend_base_usecase: true
    - usecases_follow_pattern: true
    - variable_name_should_contain_class_name: true
    - viewmodels_call_super_dispose: true
    - viewmodels_extend_base_viewmodel: true
    - viewmodels_no_buildcontext: true
    - viewmodels_no_flutter_types: true
