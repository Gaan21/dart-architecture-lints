# Generated by tool/generate_rule_tables.dart; edit selections in your project.
# style selection. See docs/configuration.md before adopting a profile.
analyzer:
  plugins:
    - custom_lint
custom_lint:
  enable_all_lint_rules: false
  rules:
    - app_exception_must_define_code: false
    - avoid_async_in_provider_create: false
    - avoid_async_wrapper_hides_unawaited: false
    - avoid_hardcoded_strings: false
    - avoid_scattered_401_handling: false
    - avoid_unawaited: false
    - avoid_unawaited_ignore_without_reason: false
    - datasources_return_result: false
    - domain_entities_must_use_freezed: false
    - enforce_final_variables: true
    - enforce_utc_dates: false
    - logger_context_matches_scope: false
    - logger_context_must_be_structured: false
    - method_order: true
    - mixin_no_state_ownership: false
    - models_must_have_json_serialization: false
    - multiprovider_order: false
    - no_bang_operator: false
    - no_business_logic_in_widgets: false
    - no_civil_utc_mix_without_helper: false
    - no_device_local_in_presentation: false
    - no_direct_error_logging_in_data_domain: false
    - no_direct_internet_calls: false
    - no_domain_entities_in_presentation_ui: false
    - no_exception_message_passthrough: false
    - no_external_dependencies_in_domain: false
    - no_hardcoded_border_radius: false
    - no_hardcoded_color_literal: false
    - no_late_keyword: false
    - no_local_datetime_constructors: false
    - no_raw_exception_message_to_user: false
    - no_result_throw: false
    - no_sensitive_data_in_log_metadata: false
    - no_serialization_in_entities: false
    - no_static_map_controllers: false
    - no_utc_time_format_without_empresa_helper: false
    - one_class_per_file: false
    - overlay_lifecycle_context_safety: false
    - repository_methods_return_result: false
    - require_explicit_types: true
      policy: selective
    - require_keys_in_lists: false
    - streamcontroller_must_close: false
    - top_level_screens_must_use_base_contract: false
    - uistate_must_call_super_dispose: false
    - usecases_extend_base_usecase: false
    - usecases_follow_pattern: false
    - variable_name_should_contain_class_name: true
    - viewmodels_call_super_dispose: false
    - viewmodels_extend_base_viewmodel: false
    - viewmodels_no_buildcontext: false
    - viewmodels_no_flutter_types: false
